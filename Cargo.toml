[workspace]
resolver = "3"
members = ["crates/launcher-core", "crates/launcher-cli", "src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/Mehbur07/MehburMC-Launcher"
rust-version = "1.88"

[workspace.dependencies]
launcher-core = { path = "crates/launcher-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
fs4 = "1.1.0"
futures-util = "0.3.34"
hex = "0.4.3"
base64 = "0.23.1"
md-5 = "0.11.0"
png = "0.18.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "signal", "sync", "time"] }
tokio-util = "0.7.19"
wiremock = "0.6.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ts-rs = "12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
