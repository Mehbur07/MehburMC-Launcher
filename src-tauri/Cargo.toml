[package]
name = "mehbur-launcher"
description = "MehburMC Launcher desktop app (thin Tauri wrapper around launcher-core)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mehbur_launcher_lib"
# staticlib/cdylib: Android (Tauri mobile) uygulaması bu kütüphaneyi .so olarak yükler.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
launcher-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
ts-rs.workspace = true

# Yalnızca masaüstü: telefonda tek pencere ve kendi kendini güncelleme yok
# (Android güncellemesi yeni APK ile gelir).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2"

[lints]
workspace = true
